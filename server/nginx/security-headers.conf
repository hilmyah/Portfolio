# Header keamanan portfolio. Di-include dari setiap location yang memasang add_header sendiri,
# karena nginx membuang add_header warisan di location seperti itu.
#
# connect-src mengizinkan semua origin https: karena cadangan terminal di browser memanggil
# dns.google, cloudflare-dns.com, rdap.org (yang meneruskan ke tiap registry) dan mengukur
# request HTTPS ke host apa saja untuk ping.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
