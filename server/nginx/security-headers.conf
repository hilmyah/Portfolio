# Security headers for the portfolio. Included from every location that sets its own add_header,
# because nginx drops inherited add_header directives in such locations.
#
# connect-src allows any https: origin because the terminal's browser fallbacks query
# dns.google, cloudflare-dns.com, rdap.org (which redirects to each registry) and time HTTPS
# requests to arbitrary hosts for ping.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
