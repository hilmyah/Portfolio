# /etc/nginx/sites-available/portfolio.conf
# Butuh /etc/nginx/snippets/portfolio-security-headers.conf (salinan server/nginx/security-headers.conf)
# dan paket libnginx-mod-http-brotli-static. Urutan pemasangan ada di server/DEPLOY.md.
server {
    listen 80;
    listen [::]:80;
    server_name hilmyah.my.id www.hilmyah.my.id;

    # current adalah symlink ke rilis yang aktif, diganti oleh server/deploy.sh dalam satu langkah.
    root /home/hilmy/projects/portfolio-releases/current;
    index index.html;
    # HTML, teks dan JS ditulis UTF-8; security.txt (RFC 9116) wajib menyebut charset=utf-8.
    charset utf-8;

    include snippets/portfolio-security-headers.conf;

    # Build membuat salinan .br (brotli level 11) untuk setiap file teks, lihat vite.plugins.ts.
    # Cloudflare meminta "br, gzip" ke server ini dan meneruskan kompresi itu ke pengunjung, jadi JS
    # dan CSS sampai sekitar 12% lebih kecil daripada gzip. Butuh paket libnginx-mod-http-brotli-static.
    brotli_static on;

    # Kompresi saat itu juga untuk yang tidak punya salinan .br: respons /api/ dan pengunjung yang
    # tidak menerima brotli. gzip_proxied any: tetap dikompres walaupun request datang lewat proxy.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;

    # Backend terminal (server/netapi.mjs). Output-nya dialirkan, jadi tidak boleh ada buffer di tengah.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # bait: path yang biasa dicoba scanner dan pengunjung iseng (WordPress, PHP, panel admin, .env,
    # .git, file backup) mendapat public/nice-try.html dengan status 404 biasa. Location regex
    # dicek berurutan, jadi blok ini harus tetap di atas aturan file statis di bawah.
    location ~* "^/(wp-admin|wp-login\.php|wp-content|wp-includes|wordpress|xmlrpc\.php|phpmyadmin|pma|adminer|admin|administrator|login|cpanel|plesk|webmail|server-status|server-info|cgi-bin|actuator|console|shell|etc|proc|vendor)(/|$)|\.(php\d?|phtml|asp|aspx|jsp|cgi|pl|env|ini|bak|old|sql|sqlite|db|log|swp|ya?ml|config|conf)$|/\.(env|git|svn|hg|aws|ssh|docker|htaccess|htpasswd|ds_store|vscode|idea)" {
        error_page 404 /nice-try.html;
        return 404;
    }

    # JS, CSS dan font hasil build punya hash di nama file, jadi aman di-cache selamanya.
    # ^~ menghentikan pengecekan location regex: tanpa itu, font .woff2 di sini ikut aturan
    # "cache sehari" di bawah.
    location ^~ /assets/ {
        include snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Halaman utama. Browser selalu bertanya ulang (no-cache), supaya hasil deploy langsung terlihat.
    # Cloudflare-CDN-Cache-Control hanya dibaca Cloudflare dan tidak diteruskan ke browser: HTML
    # disimpan di edge 1 jam, lalu masih boleh dipakai sampai 7 hari sambil diperbarui di belakang
    # layar, jadi pengunjung tidak menunggu perjalanan lewat tunnel. Aktif setelah Cache Rule untuk
    # "/" dan "/index.html" dibuat di dashboard (server/DEPLOY.md). server/deploy.sh menghapus cache
    # HTML ini setiap deploy, dan aset lama tetap disimpan 14 hari untuk HTML yang belum terhapus.
    location = /index.html {
        include snippets/portfolio-security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Cloudflare-CDN-Cache-Control "max-age=3600, stale-while-revalidate=604800";
    }

    # File dari public/ namanya tetap antar deploy: cache sehari.
    location ~* \.(?:png|webp|jpe?g|svg|ico|mpeg|mp3|woff2?)$ {
        include snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Situs ini satu halaman tanpa route lain, jadi URL yang tidak ada dijawab 404 dengan isi halaman
    # utama: pengunjung yang salah ketik tetap melihat portfolio, dengan pesan "No such file or
    # directory" di atasnya (src/components/NotFound.tsx). Mesin pencari dan Lighthouse jadi tahu file
    # seperti /.well-known/ai-catalog.json memang tidak ada.
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /index.html;
}
