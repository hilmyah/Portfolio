# /etc/nginx/sites-available/portfolio.conf
# Requires /etc/nginx/snippets/portfolio-security-headers.conf (copy of server/nginx/security-headers.conf).
server {
    listen 80;
    listen [::]:80;
    server_name hilmyah.my.id www.hilmyah.my.id;

    root /home/hilmy/projects/Portfolio/dist;
    index index.html;

    include snippets/portfolio-security-headers.conf;

    # Terminal backend (server/netapi.mjs). Output is streamed, so nothing may buffer it.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Built JS and CSS have content hashes in their names, so they can be cached forever.
    location /assets/ {
        include snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The page itself must never be cached, so a deploy shows up immediately.
    location = /index.html {
        include snippets/portfolio-security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Files from public/ keep their names between deploys: cache them for a day.
    location ~* \.(?:png|webp|jpe?g|svg|ico|mpeg|mp3|woff2?)$ {
        include snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
