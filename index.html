<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hilmy Adhyandra Hamzah</title>
    <meta name="description" content="Hilmy Adhyandra Hamzah - Infrastructure and Systems. Linux, self-hosting, networking, automation." />
    <meta name="theme-color" content="#111111" />
    <link rel="canonical" href="https://hilmyah.my.id/" />
    <!-- Browser modern memakai SVG. Safari sebelum versi 26 belum mendukung favicon SVG, jadi
         memakai favicon.ico; sizes="32x32" membuat Chrome tetap memilih SVG. apple-touch-icon untuk
         ikon di layar utama iPhone dan iPad. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/logo-temp.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hilmy Adhyandra Hamzah" />
    <meta property="og:url" content="https://hilmyah.my.id/" />
    <meta property="og:title" content="Hilmy Adhyandra Hamzah" />
    <meta property="og:description" content="Infrastructure and Systems. Linux, self-hosting, networking, automation." />
    <meta property="og:image" content="https://hilmyah.my.id/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hilmy Adhyandra Hamzah, Infrastructure and Systems" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Saat build, src/prerender.tsx mengisi #root dengan halaman jadi, dan menambahkan di akhir
         <head> ini preload foto profil serta data terstruktur untuk mesin pencari (JSON-LD), dua-duanya
         dibuat dari src/data.ts. Atribut prerender menandai script yang mengekspor fungsi prerender. -->
    <script src="/theme-init.js"></script>
    <!-- Tanpa JavaScript, bagian yang biasanya muncul saat di-scroll (.reveal di src/index.css) tetap
         ditampilkan. "html" menaikkan prioritas aturan ini di atas aturan di file CSS. -->
    <noscript><style>html .reveal { opacity: 1; transform: none; }</style></noscript>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script prerender type="module" src="/src/main.tsx"></script>
  </body>
</html>
