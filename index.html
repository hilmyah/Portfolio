<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hilmy Adhyandra Hamzah</title>
    <meta name="description" content="Hilmy Adhyandra Hamzah - Infrastructure and Systems. Linux, self-hosting, networking, automation." />
    <meta name="theme-color" content="#111111" />
    <link rel="canonical" href="https://hilmyah.my.id/" />
    <!-- Browser modern memakai SVG. Safari sebelum versi 26 belum mendukung favicon SVG, jadi
         memakai favicon.ico; sizes="32x32" membuat Chrome tetap memilih SVG. apple-touch-icon untuk
         ikon di layar utama iPhone dan iPad. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/logo-temp.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hilmy Adhyandra Hamzah" />
    <meta property="og:url" content="https://hilmyah.my.id/" />
    <meta property="og:title" content="Hilmy Adhyandra Hamzah" />
    <meta property="og:description" content="Infrastructure and Systems. Linux, self-hosting, networking, automation." />
    <meta property="og:image" content="https://hilmyah.my.id/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hilmy Adhyandra Hamzah, Infrastructure and Systems" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Data terstruktur untuk mesin pencari: siapa pemilik situs ini dan akun resminya (sameAs).
         Format: https://developers.google.com/search/docs/appearance/structured-data/profile-page
         Ini data, bukan JavaScript, jadi tidak dijalankan browser dan tidak terkena
         Content-Security-Policy. Samakan isinya dengan src/data.ts kalau profil berubah. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfilePage",
        "url": "https://hilmyah.my.id/",
        "mainEntity": {
          "@type": "Person",
          "name": "Hilmy Adhyandra Hamzah",
          "alternateName": "hilmyah",
          "description": "Infrastructure & Systems. Linux, self-hosting, networking, automation.",
          "image": "https://hilmyah.my.id/placeholder/me.webp",
          "url": "https://hilmyah.my.id/",
          "sameAs": [
            "https://github.com/hilmyah",
            "https://www.linkedin.com/in/hilmyah/",
            "https://www.instagram.com/hlmydr/",
            "https://www.facebook.com/andra.794636"
          ]
        }
      }
    </script>

    <!-- Foto profil (elemen terbesar di layar pertama) diunduh bersamaan dengan JavaScript,
         tidak menunggu halaman selesai dirender. -->
    <link rel="preload" as="image" href="/placeholder/me.webp" fetchpriority="high" />
    <script src="/theme-init.js"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
